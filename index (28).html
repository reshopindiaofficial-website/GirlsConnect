<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GirlsConnect</title>
<style>
  :root{
    --pink:#ff4d8d; --rose:#ff7eb3; --purple:#7b2ff7; --dark:#1b1030; --card:#ffffff; --muted:#6f6783;
    --grad:linear-gradient(135deg,#ff4d8d 0%,#b44cff 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f7f2fb;color:var(--dark);min-height:100vh}
  .screen{display:none;min-height:100vh;animation:fade .35s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  button{font-family:inherit;cursor:pointer;border:none}

  /* HERO */
  #hero{background:radial-gradient(circle at 20% 15%,#ff9ac1 0,transparent 45%),radial-gradient(circle at 85% 80%,#9f6bff 0,transparent 50%),linear-gradient(160deg,#2a0f4a,#6a1b9a 55%,#c2185b);color:#fff;position:relative;overflow:hidden}
  #hero.active{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .float-heart{position:absolute;bottom:-40px;font-size:22px;opacity:.5;animation:rise linear infinite;pointer-events:none}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
  .brand{font-size:18px;letter-spacing:3px;text-transform:uppercase;opacity:.9;margin-bottom:10px;font-weight:600}
  .couple{width:min(380px,86vw);filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));margin:6px 0 10px}
  #hero h1{font-size:clamp(28px,6vw,48px);line-height:1.15;margin:8px 0 8px;font-weight:800}
  #hero p{max-width:420px;opacity:.88;margin-bottom:26px;line-height:1.5}
  .btn-main{background:var(--grad);color:#fff;font-size:18px;font-weight:700;padding:15px 52px;border-radius:50px;box-shadow:0 10px 26px rgba(255,77,141,.45);transition:transform .15s}
  .btn-main:active{transform:scale(.96)}
  .btn-main:hover{transform:translateY(-2px)}

  /* TOP BAR */
  .topbar{background:var(--grad);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(123,47,247,.3)}
  .topbar h2{font-size:21px;font-weight:800}
  .topbar .me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:4px 12px 4px 4px;border-radius:30px;cursor:pointer;font-size:14px;font-weight:600}
  .topbar .me img{width:30px;height:30px;border-radius:50%;background:#fff}
  .back{background:rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px}

  /* FORM */
  #register{background:linear-gradient(160deg,#fbeaff,#ffe3ef)}
  #register.active{display:flex;align-items:center;justify-content:center;padding:20px}
  .form-card{background:var(--card);width:100%;max-width:440px;border-radius:26px;padding:26px 22px 24px;box-shadow:0 20px 50px rgba(123,47,247,.18)}
  .form-card h2{text-align:center;font-size:24px;margin-bottom:4px}
  .form-card .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
  label.l{display:block;font-size:13px;font-weight:700;color:#4a3d63;margin:14px 0 6px}
  input[type=text],input[type=tel],select{width:100%;padding:13px 14px;border:2px solid #eadff5;border-radius:12px;font-size:16px;background:#fcfaff;outline:none;font-family:inherit;transition:border .2s}
  input:focus,select:focus{border-color:var(--pink)}
  .gender-row{display:flex;gap:12px}
  .gender-opt{flex:1}
  .gender-opt input{display:none}
  .gender-opt span{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:2px solid #eadff5;border-radius:12px;font-weight:700;cursor:pointer;background:#fcfaff;transition:.2s}
  .gender-opt input:checked + span{border-color:var(--pink);background:#fff0f6;color:var(--pink);box-shadow:0 4px 14px rgba(255,77,141,.2)}
  .avatar-box{display:none;flex-direction:column;align-items:center;margin:16px 0 4px;gap:10px}
  .avatar-box.show{display:flex}
  .avatar-box img{width:104px;height:104px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--pink),0 10px 22px rgba(0,0,0,.15);background:#fff}
  .btn-swap{background:#f3e8ff;color:var(--purple);padding:9px 20px;border-radius:30px;font-weight:700;font-size:14px}
  .btn-swap:active{transform:scale(.95)}
  .err{color:#d6204f;font-size:13px;margin-top:10px;min-height:18px;text-align:center;font-weight:600}
  .btn-join{width:100%;margin-top:10px;background:var(--grad);color:#fff;font-size:18px;font-weight:800;padding:15px;border-radius:14px;box-shadow:0 10px 22px rgba(255,77,141,.35)}
  .link-btn{display:block;margin:14px auto 0;background:none;color:var(--muted);font-size:14px}

  /* HOME */
  #home{padding-bottom:30px}
  .list-wrap{max-width:900px;margin:0 auto;padding:18px 14px}
  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .tabs{display:flex;gap:10px;width:100%}
  .tab{flex:1;padding:12px 10px;border-radius:14px;font-size:16px;font-weight:800;background:#fff;color:var(--muted);border:2px solid #eadff5;transition:.2s}
  .tab span{display:inline-block;min-width:22px;margin-left:6px;padding:1px 7px;border-radius:12px;font-size:12px;background:#f3e8ff;color:var(--purple)}
  .tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(255,77,141,.3)}
  .tab.active span{background:rgba(255,255,255,.28);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{background:var(--card);border-radius:20px;padding:20px 14px 16px;text-align:center;box-shadow:0 8px 22px rgba(80,40,120,.1);animation:fade .4s ease;transition:transform .2s}
  .card:hover{transform:translateY(-4px)}
  .card img{width:96px;height:96px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 3px #ffc2da;background:#fff;transition:.2s}
  .card img:hover{box-shadow:0 0 0 3px var(--pink)}
  .card .nm{font-weight:800;font-size:17px;margin-top:12px;word-break:break-word}
  .tag{display:inline-block;margin:6px 0 12px;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700}
  .tag.f{background:#ffe4ef;color:#d81b60}
  .tag.m{background:#e3efff;color:#1565c0}
  .btn-chat{width:100%;background:#25d366;color:#fff;font-weight:800;padding:11px;border-radius:12px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn-chat:active{transform:scale(.97)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
  .empty b{display:block;font-size:44px;margin-bottom:8px}

  /* PROFILE */
  #profile{background:#f7f2fb}
  .pf-head{background:var(--grad);height:170px}
  .pf-card{max-width:440px;margin:-80px auto 0;background:#fff;border-radius:26px;padding:0 22px 26px;text-align:center;box-shadow:0 20px 50px rgba(123,47,247,.18)}
  .pf-card img{width:140px;height:140px;border-radius:50%;margin-top:-70px;border:5px solid #fff;box-shadow:0 10px 26px rgba(0,0,0,.2);background:#fff;position:relative;top:70px;margin-top:0;transform:translateY(-70px)}
  .pf-card .inner{padding-top:0;margin-top:0}
  .pf-card h2{margin-top:6px;font-size:26px;word-break:break-word}
  .details{margin:18px 0;text-align:left}
  .row{display:flex;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid #f0e7f8;font-size:15px}
  .row span:first-child{color:var(--muted);font-weight:600}
  .row span:last-child{font-weight:700;text-align:right;word-break:break-all}
  .pf-actions{display:flex;flex-direction:column;gap:10px}
  .btn-logout{background:#fff0f3;color:#d6204f;font-weight:800;padding:13px;border-radius:12px;font-size:15px;border:2px solid #ffd0db}
</style>
</head>
<body>

<!-- ============ HERO ============ -->
<section id="hero" class="screen active">
  <div class="brand">💖 GirlsConnect</div>

  <!-- Couple embracing illustration -->
  <svg class="couple" viewBox="0 0 400 330" xmlns="http://www.w3.org/2000/svg" aria-label="Couple embracing">
    <defs>
      <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6e8"/><stop offset="1" stop-color="#ffb3d1"/></linearGradient>
    </defs>
    <circle cx="200" cy="165" r="150" fill="rgba(255,255,255,.12)"/>
    <!-- heart above -->
    <path d="M200 70c-14-26-52-14-44 14 6 20 30 34 44 46 14-12 38-26 44-46 8-28-30-40-44-14z" fill="url(#gl)" opacity=".95"/>
    <!-- man (left) body -->
    <path d="M70 330c0-70 18-120 70-130h40v130z" fill="#3a6bd8"/>
    <!-- woman (right) body -->
    <path d="M330 330c0-70-18-120-70-130h-40v130z" fill="#e8408a"/>
    <!-- man's arm around her -->
    <path d="M150 215c40 4 100 0 130 18l-6 26c-40-12-90-8-130-6z" fill="#2d56b5"/>
    <!-- woman's arm around him -->
    <path d="M250 225c-40 6-90 4-125 24l8 24c34-18 80-18 120-22z" fill="#c92d74"/>
    <!-- heads -->
    <ellipse cx="165" cy="150" rx="40" ry="44" fill="#f2c29b" transform="rotate(12 165 150)"/>
    <ellipse cx="235" cy="150" rx="40" ry="44" fill="#f7cfae" transform="rotate(-12 235 150)"/>
    <!-- man hair -->
    <path d="M122 140c-2-40 28-60 62-52 30 6 44 24 38 44-12-18-30-24-52-22-22 2-36 14-48 30z" fill="#2b1a12"/>
    <!-- woman hair -->
    <path d="M278 140c2-42-26-62-60-54-26 6-38 22-36 40 10-18 30-24 50-20 20 4 34 16 46 34z" fill="#4a2318"/>
    <path d="M278 140c4 40 6 80-6 100l-16-8c8-20 6-60 2-84z" fill="#4a2318"/>
    <!-- closed happy eyes -->
    <path d="M148 152q7 6 14 0M172 148q7 6 14 0" stroke="#3b2418" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M214 148q7 6 14 0M238 152q7 6 14 0" stroke="#3b2418" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- smiles -->
    <path d="M158 170q10 10 20 2" stroke="#b5483c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M222 172q10 8 20-2" stroke="#d1456a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="150" cy="166" r="7" fill="#ff8da1" opacity=".5"/><circle cx="250" cy="166" r="7" fill="#ff8da1" opacity=".5"/>
  </svg>

  <h1>Welcome GirlsConnect Family</h1>
  <p>Meet new people, make friends and start a chat in just one tap.</p>
  <button class="btn-main" id="startBtn">Start</button>
</section>

<!-- ============ REGISTER ============ -->
<section id="register" class="screen">
  <div class="form-card">
    <h2>Create your profile</h2>
    <div class="sub">Join the GirlsConnect family</div>

    <label class="l" for="fName">Name</label>
    <input type="text" id="fName" maxlength="30" placeholder="Enter your name" autocomplete="off">

    <label class="l">Gender</label>
    <div class="gender-row">
      <label class="gender-opt"><input type="radio" name="gender" value="Male"><span>👨 Male</span></label>
      <label class="gender-opt"><input type="radio" name="gender" value="Female"><span>👩 Female</span></label>
    </div>

    <div class="avatar-box" id="avatarBox">
      <img id="avatarImg" alt="Avatar">
      <button type="button" class="btn-swap" id="swapBtn">🔄 Change Avatar</button>
    </div>

    <label class="l" for="fCountry">Country</label>
    <select id="fCountry"></select>

    <label class="l" for="fMobile">Mobile Number</label>
    <input type="tel" id="fMobile" inputmode="numeric" maxlength="15" placeholder="Mobile number (without country code)">

    <div class="err" id="formErr"></div>
    <button class="btn-join" id="joinBtn">Join Now</button>
    <button class="link-btn" id="backHero">← Back</button>
  </div>
</section>

<!-- ============ HOME ============ -->
<section id="home" class="screen">
  <div class="topbar">
    <h2>💖 GirlsConnect</h2>
    <div class="me" id="meChip"><img id="meImg" alt=""><span id="meName"></span></div>
  </div>
  <div class="list-wrap">
    <div class="list-head">
      <div class="tabs">
        <button class="tab active" id="tabAll">All <span id="cntAll">0</span></button>
        <button class="tab" id="tabLatest">Latest <span id="cntLatest">0</span></button>
      </div>
    </div>
    <div class="grid" id="userGrid"></div>
  </div>
</section>

<!-- ============ PROFILE VIEW ============ -->
<section id="profile" class="screen">
  <div class="topbar">
    <button class="back" id="profBack">←</button>
    <h2>Profile</h2>
    <span style="width:38px"></span>
  </div>
  <div class="pf-head"></div>
  <div class="pf-card">
    <img id="pfImg" alt="">
    <div class="inner">
      <h2 id="pfName"></h2>
      <span class="tag" id="pfTag"></span>
      <div class="details">
        <div class="row"><span>Name</span><span id="pfName2"></span></div>
        <div class="row"><span>Gender</span><span id="pfGender"></span></div>
        <div class="row"><span>Mobile</span><span id="pfMobile"></span></div>
        <div class="row"><span>Country</span><span id="pfCountry"></span></div>
        <div class="row"><span>Joined</span><span id="pfJoined"></span></div>
      </div>
      <div class="pf-actions">
        <a class="btn-chat" id="pfChat" target="_blank" rel="noopener">💬 Chat Now</a>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVhHNtZum0DXRa-syl6ckHDl0zxioyw9U",
  authDomain: "girlsconnect-590f8.firebaseapp.com",
  projectId: "girlsconnect-590f8",
  storageBucket: "girlsconnect-590f8.firebasestorage.app",
  messagingSenderId: "322265065914",
  appId: "1:322265065914:web:1529e3f6da93cfde8f9583"
};
const fbApp = initializeApp(firebaseConfig);
const fs = getFirestore(fbApp);

/* ==========================================================
   DATA LAYER  — abhi localStorage; baad me Firebase yahin judega
   ----------------------------------------------------------
   Firebase add karne ke liye sirf ye 3 functions badalne hain:
     DB.getUsers()   -> Firestore se users lao (orderBy createdAt desc)
     DB.addUser(u)   -> Firestore me addDoc(...)
     DB.getSession() / DB.setSession() / DB.clearSession() -> Firebase Auth / local
   ========================================================== */
let USERS = [];          // Firestore se live aane wala data
let activeTab = "all";   // "all" ya "latest"
const DB = {
  SESSION_KEY: "gc_session",
  getUsers(){ return USERS; },
  async addUser(u){
    await setDoc(doc(fs, "users", u.id), u);          // Firestore: collection "users"
    if(!USERS.some(x => x.id === u.id)) USERS.push(u); // turant local list me bhi
    return u;
  },
  subscribe(onChange, onError){
    const q = query(collection(fs, "users"), orderBy("createdAt", "desc"));
    return onSnapshot(q, snap => { USERS = snap.docs.map(d => d.data()); onChange(); }, onError);
  },
  getSession(){ return localStorage.getItem(this.SESSION_KEY); },
  setSession(id){ localStorage.setItem(this.SESSION_KEY, id); },
  clearSession(){ localStorage.removeItem(this.SESSION_KEY); }
};

/* ---------- Countries (dial codes for WhatsApp) ---------- */
const COUNTRIES = [
  ["India","91"],["Pakistan","92"],["Bangladesh","880"],["Nepal","977"],["Sri Lanka","94"],
  ["United States","1"],["Canada","1"],["United Kingdom","44"],["Australia","61"],["New Zealand","64"],
  ["United Arab Emirates","971"],["Saudi Arabia","966"],["Qatar","974"],["Kuwait","965"],["Oman","968"],
  ["Singapore","65"],["Malaysia","60"],["Indonesia","62"],["Philippines","63"],["Thailand","66"],
  ["Germany","49"],["France","33"],["Italy","39"],["Spain","34"],["Netherlands","31"],
  ["Russia","7"],["Turkey","90"],["Egypt","20"],["South Africa","27"],["Nigeria","234"],
  ["Kenya","254"],["Brazil","55"],["Mexico","52"],["Japan","81"],["China","86"],["South Korea","82"]
];

/* ---------- Avatar generator (offline SVG, gender based) ---------- */
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function pick(r, arr){ return arr[Math.floor(r() * arr.length)]; }

function makeAvatar(gender, seed){
  const r = rng(seed);
  const skin = pick(r, ["#f5d0b0","#e8b58c","#d39b73","#b9774f","#8d5a3b"]);
  const bg   = pick(r, ["#ffd6e8","#d9ecff","#e6dcff","#d5f5e3","#fff0c2","#ffe0cc"]);
  const hairC= pick(r, ["#1c1210","#3b2418","#5a3720","#8a5a2b","#b8862f","#2d2d3a"]);
  const shirt= pick(r, ["#ff4d8d","#7b2ff7","#2d9cdb","#27ae60","#f2994a","#eb5757"]);
  const female = gender === "Female";
  let back = "", front = "";

  if(female){
    const style = Math.floor(r()*3);
    back = style === 0
      ? `<path d="M22 86C14 40 26 12 50 12s36 28 28 74z" fill="${hairC}"/>`
      : style === 1
      ? `<path d="M24 70C16 36 28 12 50 12s34 24 26 58z" fill="${hairC}"/><circle cx="50" cy="10" r="9" fill="${hairC}"/>`
      : `<path d="M20 78C12 36 26 12 50 12s38 24 30 66c-6-10-4-30-8-34H28c-4 4-2 24-8 34z" fill="${hairC}"/>`;
    front = `<path d="M28 42c2-18 14-26 22-26s20 8 22 26c-8-10-16-14-22-14s-14 4-22 14z" fill="${hairC}"/>`;
  } else {
    const style = Math.floor(r()*3);
    front = style === 0
      ? `<path d="M27 44c-2-22 10-30 23-30s25 8 23 30c-4-10-10-16-23-16S31 34 27 44z" fill="${hairC}"/>`
      : style === 1
      ? `<path d="M26 46c-4-26 8-34 24-34s28 8 24 34c-2-12-8-20-24-20S28 34 26 46z" fill="${hairC}"/>`
      : `<path d="M28 40c0-16 10-22 22-22s22 6 22 22c-6-6-12-8-22-8s-16 2-22 8z" fill="${hairC}"/>`;
  }
  const beard = (!female && r() < .3) ? `<path d="M34 56c2 16 8 22 16 22s14-6 16-22c-4 8-10 10-16 10s-12-2-16-10z" fill="${hairC}" opacity=".85"/>` : "";
  const lips = female ? "#d1456a" : "#a85a4a";
  const lash = female ? `<path d="M37 47l-3-2M63 47l3-2" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>` : "";

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="${bg}"/>
    ${back}
    <path d="M10 100c2-20 18-28 40-28s38 8 40 28z" fill="${shirt}"/>
    <rect x="43" y="62" width="14" height="14" rx="5" fill="${skin}"/>
    <ellipse cx="50" cy="46" rx="21" ry="24" fill="${skin}"/>
    ${beard}${front}
    <circle cx="41" cy="48" r="2.6" fill="#222"/><circle cx="59" cy="48" r="2.6" fill="#222"/>
    ${lash}
    <path d="M43 60q7 6 14 0" stroke="${lips}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="35" cy="56" r="4" fill="#ff8da1" opacity=".35"/><circle cx="65" cy="56" r="4" fill="#ff8da1" opacity=".35"/>
  </svg>`;
}
function avatarURI(gender, seed){
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(makeAvatar(gender, seed));
}

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function waLink(u){
  const num = (u.dial + String(u.mobile).replace(/\D/g,"").replace(/^0+/,""));
  return "https://wa.me/" + num + "?text=" + encodeURIComponent("Hi " + u.name + ", I found you on GirlsConnect 👋");
}
function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
function getUser(id){ return DB.getUsers().find(u => u.id === id); }

/* ---------- Floating hearts on hero ---------- */
(function(){
  const hero = $("hero");
  for(let i=0;i<14;i++){
    const h = document.createElement("div");
    h.className = "float-heart";
    h.textContent = ["💗","💖","💕","✨"][i%4];
    h.style.left = Math.random()*100 + "%";
    h.style.fontSize = (14 + Math.random()*22) + "px";
    h.style.animationDuration = (8 + Math.random()*10) + "s";
    h.style.animationDelay = (-Math.random()*12) + "s";
    hero.appendChild(h);
  }
})();

/* ---------- Registration form ---------- */
const countrySel = $("fCountry");
COUNTRIES.forEach(([n,d]) => {
  const o = document.createElement("option");
  o.value = n; o.textContent = `${n} (+${d})`;
  countrySel.appendChild(o);
});
countrySel.value = "India";

let curGender = "", curSeed = 0;
function refreshAvatar(){
  $("avatarImg").src = avatarURI(curGender, curSeed);
  $("avatarBox").classList.add("show");
}
document.querySelectorAll('input[name="gender"]').forEach(r => {
  r.addEventListener("change", () => {
    curGender = r.value;
    curSeed = Math.floor(Math.random()*1e9);   // gender chunte hi random avatar
    refreshAvatar();
  });
});
$("swapBtn").onclick = () => { curSeed = Math.floor(Math.random()*1e9); refreshAvatar(); };

$("startBtn").onclick = () => show("register");
$("backHero").onclick = () => show("hero");

$("joinBtn").onclick = async () => {
  const name = $("fName").value.trim();
  const country = $("fCountry").value;
  const mobile = $("fMobile").value.replace(/\D/g,"");
  const err = $("formErr");
  err.textContent = "";

  if(name.length < 2){ err.textContent = "Please enter your name."; return; }
  if(!curGender){ err.textContent = "Please select your gender."; return; }
  if(mobile.length < 6 || mobile.length > 15){ err.textContent = "Please enter a valid mobile number."; return; }

  const dial = COUNTRIES.find(c => c[0] === country)[1];
  const user = {
    id: "u" + Date.now() + Math.floor(Math.random()*1000),
    name, gender: curGender, mobile, country, dial,
    avatarSeed: curSeed,
    createdAt: Date.now()
  };
  const btn = $("joinBtn");
  btn.disabled = true; btn.textContent = "Please wait...";
  try{
    await DB.addUser(user);
  }catch(e){
    console.error(e);
    err.textContent = "Could not save. Check internet and Firestore rules.";
    btn.disabled = false; btn.textContent = "Join Now";
    return;
  }
  btn.disabled = false; btn.textContent = "Join Now";
  DB.setSession(user.id);

  // reset form
  $("fName").value = ""; $("fMobile").value = "";
  document.querySelectorAll('input[name="gender"]').forEach(r => r.checked = false);
  $("avatarBox").classList.remove("show");
  curGender = ""; curSeed = 0;

  openHome();
};

/* ---------- Home ---------- */
function openHome(){
  const me = getUser(DB.getSession());
  if(!me){ show("hero"); return; }
  $("meImg").src = avatarURI(me.gender, me.avatarSeed);
  $("meName").textContent = me.name;
  renderUsers();
  show("home");
}
function renderUsers(){
  const me = getUser(DB.getSession());
  const everyone = DB.getUsers().slice().sort((a,b) => b.createdAt - a.createdAt); // newest first
  const grid = $("userGrid");
  const joinedAt = me ? me.createdAt : 0;
  const before = everyone.filter(u => u.createdAt <= joinedAt);  // All: aapse pehle jude
  const after  = everyone.filter(u => u.createdAt > joinedAt);   // Latest: aapke baad jude
  $("cntAll").textContent = before.length;
  $("cntLatest").textContent = after.length;
  $("tabAll").classList.toggle("active", activeTab === "all");
  $("tabLatest").classList.toggle("active", activeTab === "latest");
  const users = activeTab === "all" ? before : after;
  if(!users.length){
    grid.innerHTML = '<div class="empty"><b>💞</b>' +
      (activeTab === "all" ? "No members yet." : "No new members since you joined.") + '</div>';
    return;
  }
  grid.innerHTML = users.map(u => `
    <div class="card">
      <img src="${avatarURI(u.gender,u.avatarSeed)}" alt="${esc(u.name)}" data-id="${u.id}">
      <div class="nm">${esc(u.name)}</div>
      <span class="tag ${u.gender==="Female"?"f":"m"}">${u.gender==="Female"?"👩":"👨"} ${u.gender}</span>
      <a class="btn-chat" href="${waLink(u)}" target="_blank" rel="noopener">💬 Chat Now</a>
    </div>`).join("");
  grid.querySelectorAll("img").forEach(img => img.onclick = () => openProfile(img.dataset.id));
}
$("meChip").onclick = () => openProfile(DB.getSession());

/* ---------- Profile view ---------- */
function openProfile(id){
  const u = getUser(id);
  if(!u) return;
  $("pfImg").src = avatarURI(u.gender, u.avatarSeed);
  $("pfName").textContent = u.name;
  $("pfName2").textContent = u.name;
  $("pfGender").textContent = u.gender;
  $("pfMobile").textContent = "+" + u.dial + " " + u.mobile;
  $("pfCountry").textContent = u.country;
  $("pfJoined").textContent = fmtDate(u.createdAt);
  const tag = $("pfTag");
  tag.className = "tag " + (u.gender==="Female" ? "f" : "m");
  tag.textContent = (u.gender==="Female" ? "👩 " : "👨 ") + u.gender;
  $("pfChat").href = waLink(u);
  show("profile");
}
$("profBack").onclick = () => openHome();
$("logoutBtn").onclick = () => { DB.clearSession(); show("hero"); };

/* ---------- Auto-login if session exists ---------- */
$("tabAll").onclick = () => { activeTab = "all"; renderUsers(); };
$("tabLatest").onclick = () => { activeTab = "latest"; renderUsers(); };

DB.subscribe(() => {
  const sid = DB.getSession();
  if(sid && getUser(sid)){
    if($("home").classList.contains("active")) renderUsers();
    else if($("hero").classList.contains("active")) openHome();
  }
}, err => {
  console.error(err);
  if($("home").classList.contains("active"))
    $("userGrid").innerHTML = '<div class="empty"><b>⚠️</b>Could not load members. Check Firestore rules.</div>';
});
</script>
</body>
</html>
